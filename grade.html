<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Grade Calculator</title>
<style>
body{font-family:Arial;background:#e8f0fe;text-align:center;padding:30px}.container{width:400px;max-width:90%;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 5px 15px #aaa}
h1{color:#2457a6}input{width:90%;padding:10px;margin:6px;border:1px solid #aaa;border-radius:6px}
button{padding:12px 25px;background:#2457a6;color:white;border:none;border-radius:6px;cursor:pointer}button:hover{background:#163d78}
#result{margin-top:20px;padding:15px;background:#f1f7ff;border-radius:8px;display:none}
</style>
</head>
<body>
<div class="container"><h1>Student Grade Calculator</h1><p>Enter marks for five subjects</p>
<input type="number" id="sub1" placeholder="Subject 1" min="0" max="100">
<input type="number" id="sub2" placeholder="Subject 2" min="0" max="100">
<input type="number" id="sub3" placeholder="Subject 3" min="0" max="100">
<input type="number" id="sub4" placeholder="Subject 4" min="0" max="100">
<input type="number" id="sub5" placeholder="Subject 5" min="0" max="100"><br><br>
<button onclick="calculateGrade()">Calculate Grade</button><div id="result"></div></div>
<script>
function calculateGrade(){
let marks=[];
for(let i=1;i<=5;i++){
let value=Number(document.getElementById("sub"+i).value);
if(value<0||value>100||isNaN(value)){alert("Please enter valid marks from 0 to 100.");return}
marks.push(value);
}
let total=0;
for(let i=0;i<marks.length;i++){total=total+marks[i]}
let average=total/5;let grade;
if(average>=90)grade="A+";
else if(average>=80)grade="A";
else if(average>=70)grade="B";
else if(average>=60)grade="C";
else if(average>=50)grade="D";
else grade="F";
let status;
if(average>=40&&!marks.includes(0))status="PASS";else status="FAIL";
let result=document.getElementById("result");result.style.display="block";
result.innerHTML="<h2>Result</h2>"+"<p><b>Total:</b> "+total+" / 500</p>"+"<p><b>Average:</b> "+average.toFixed(2)+"</p>"+"<p><b>Grade:</b> "+grade+"</p>"+"<p><b>Status:</b> "+status+"</p>";
}
</script>
</body>
</html>
