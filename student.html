<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Admission Form</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#74ebd5,#ACB6E5);min-height:100vh;padding:20px}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.2)}
h1{text-align:center;color:#243b6b;margin-bottom:10px}.subtitle{text-align:center;color:#666;margin-bottom:20px}
.media{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.media img{width:180px;height:100px;object-fit:cover;border-radius:10px}.media video{width:180px;height:100px;border-radius:10px}
.form-row{display:flex;gap:20px;margin-bottom:15px}.field{flex:1}
label{display:block;font-weight:bold;color:#333;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border:2px solid #ddd;border-radius:8px;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:#4b7bec;outline:none}
input[type=radio],input[type=checkbox]{width:auto;margin-right:5px}.gender{padding:10px;background:#f5f7ff;border-radius:8px}
textarea{resize:vertical;height:80px}h2{color:#4b7bec;margin:20px 0 12px;border-bottom:2px solid #4b7bec;padding-bottom:5px}
button{width:100%;padding:13px;border:none;border-radius:8px;background:#4b7bec;color:white;font-size:17px;cursor:pointer;margin-top:15px}
button:hover{background:#3867d6}.required{color:red}
@media(max-width:600px){body{padding:10px}.container{padding:18px}.form-row{flex-direction:column;gap:12px}.media img,.media video{width:100%;height:150px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="container">
<h1>Student Admission Form</h1><p class="subtitle">College Online Admission Portal</p>
<div class="media">
<img src="https://images.unsplash.com/photo-1564981797816-1043664bf78d?w=500" alt="College Campus">
<video controls><source src="https://edshare.gla.ac.uk/365/2.hasvideo_mp4ThumbnailVersion/Sample%20course%20%20%28short%29.mp4" type="video/mp4">Your browser does not support video.</video>
</div>
<form>
<h2>Personal Information</h2>
<div class="form-row"><div class="field"><label>Full Name <span class="required">*</span></label><input type="text" placeholder="Enter your name" required></div><div class="field"><label>Date of Birth</label><input type="date"></div></div>
<div class="form-row"><div class="field"><label>Email <span class="required">*</span></label><input type="email" placeholder="example@gmail.com" required></div><div class="field"><label>Mobile Number</label><input type="tel" placeholder="9876543210"></div></div>
<div class="form-row"><div class="field"><label>Gender</label><div class="gender"><input type="radio" name="gender"> Male <input type="radio" name="gender"> Female <input type="radio" name="gender"> Other</div></div><div class="field"><label>Age</label><input type="number" min="16" max="30"></div></div>
<h2>Academic Details</h2>
<div class="form-row"><div class="field"><label>Course</label><select><option>Select Course</option><option>Computer Science</option><option>Information Technology</option><option>Artificial Intelligence</option><option>Data Science</option></select></div><div class="field"><label>Percentage</label><input type="number" min="0" max="100" placeholder="85"></div></div>
<div class="field"><label>Upload Marksheet</label><input type="file" accept=".pdf,.jpg,.png"></div>
<h2>Address Details</h2><div class="field"><label>Address</label><textarea placeholder="Enter your complete address"></textarea></div><br>
<div class="field"><label><input type="checkbox" required> I confirm that the above information is correct.</label></div>
<button type="submit">Submit Admission Form</button>
</form></div>
</body>
</html>
